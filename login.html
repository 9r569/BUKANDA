
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BUSIP | Student Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="login-container">

        <!-- LOGIN CONTENT -->
        <section class="login-card">

            <!-- SCHOOL LOGO -->
            <div class="login-logo">
                <img src="Images/istockphoto-1020211716-1024x1024.jpg" alt="Bukanda School Logo">
            </div>

            <!-- PORTAL BRANDING -->
            <div class="login-heading">
                <h1>BUSIP</h1>
                <p>Bukanda Students Information Portal</p>
            </div>

            <!-- WELCOME MESSAGE -->
            <div class="welcome-text">
                <h2>Welcome Back</h2>
                <p>Sign in to access your student account.</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Registration Number</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input
                            type="text"
                            id="username"
                            placeholder="Enter registration number"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <i class="fa-solid fa-eye toggle-password"
                           id="togglePassword"></i>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>
              
              <!-- Login validation message -->
             <p id="loginMessage" class="login-message"></p>
            


                <button type="submit" class="login-btn">
                    Login
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <!-- ACCOUNT INFORMATION -->
            <div class="account-info">
                <p>Don't have an account?</p>
                <a href="register.html">Create Account</a>
            </div>

            <div class="login-footer">
                <p>© 2026 Bukanda Sekondari Schools</p>
                <a href="index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Website
                </a>
              </div>
        </section>

    </main>

  <script src="login.js"></script>
  
</body>
</html>
